# CPU:  docker compose up -d --build
# GPU:  docker compose --profile gpu up -d --build faceai-gpu
# Configuração: copie .env.example para .env e altere o que precisar (o ficheiro é opcional).
x-faceai: &faceai
  ports:
    - "127.0.0.1:8000:8000"   # só acessível localmente
  volumes:
    - ./data:/data            # casos, evidências, resultados e auditoria
    - faceai-models:/models   # pesos ONNX (descarregados na 1.ª utilização e verificados por SHA-256)
  env_file:
    - path: .env
      required: false
  restart: unless-stopped     # volta a arrancar depois de uma falha ou de um reinício do anfitrião
  stop_grace_period: 60s      # tempo para a análise em curso voltar à fila antes de o contentor parar
  logging:                    # registos do Docker com tamanho limitado
    driver: json-file
    options:
      max-size: "20m"
      max-file: "5"
  # o healthcheck vem do Dockerfile

services:
  faceai:
    <<: *faceai
    build:
      context: .
      args:
        EXTRA: cpu

  faceai-gpu:
    <<: *faceai
    profiles: ["gpu"]
    build:
      context: .
      args:
        EXTRA: gpu
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  faceai-models:
