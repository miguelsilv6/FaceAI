name: CI

on:
  push:
    branches: ["main", "claude/**"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Dependências do sistema (ffmpeg, WeasyPrint)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg libpango-1.0-0 libpangoft2-1.0-0
      - name: Instalar
        working-directory: backend
        run: pip install ".[cpu,dev]"
      - name: Ruff
        working-directory: backend
        run: ruff check .
      - name: Testes (motor simulado, sem modelos)
        working-directory: backend
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar
        working-directory: frontend
        run: npm ci
      - name: Tipos e build
        working-directory: frontend
        run: npm run build
