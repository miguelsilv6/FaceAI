[project]
name = "faceai"
version = "0.1.0"
description = "Deteção de uma pessoa em vídeos de CCTV a partir de imagens de referência (DeepFace + FastAPI)"
requires-python = ">=3.11"
dependencies = [
    "deepface>=0.0.93",
    "tf-keras>=2.16",
    "opencv-python-headless>=4.9",
    "numpy>=1.26",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlmodel>=0.0.22",
    "python-multipart>=0.0.9",
    "jinja2>=3.1",
    "weasyprint>=62",
]

[project.optional-dependencies]
cpu = ["tensorflow>=2.16"]
gpu = ["tensorflow[and-cuda]>=2.16"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["templates/*.j2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["e2e: teste com modelos reais do DeepFace (lento; requer FACEAI_E2E_DATASET)"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "I"]
ignore = ["B008"]
