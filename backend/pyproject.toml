[project]
name = "faceai"
version = "0.1.0"
description = "Deteção de uma pessoa em vídeos de CCTV a partir de imagens de referência (ONNX Runtime + FastAPI)"
requires-python = ">=3.11"
dependencies = [
    "opencv-python-headless>=4.9",
    "numpy>=1.26",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlmodel>=0.0.22",
    "python-multipart>=0.0.9",
    "jinja2>=3.1",
    "weasyprint>=62",
    "rapidocr>=3.0",  # OCR da data/hora do CCTV (PP-OCR em ONNX Runtime; modelos incluídos no pacote)
    # Autenticação: Argon2id, TOTP (MFA), QR code local, AES-GCM para os segredos TOTP
    "argon2-cffi>=23.1",
    "pyotp>=2.9",
    "segno>=1.6",
    "cryptography>=42",
]

[project.optional-dependencies]
# Motor ONNX (por omissão): escolher UM dos dois
cpu = ["onnxruntime>=1.18"]
gpu = ["onnxruntime-gpu[cuda,cudnn]>=1.21"]
# Motor DeepFace/TensorFlow (opcional; FACEAI_ENGINE=deepface)
deepface = ["deepface>=0.0.93", "tf-keras>=2.16", "tensorflow>=2.16"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["templates/*.j2", "data/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["e2e: teste com modelos reais (requer FACEAI_E2E_DATASET e download dos modelos)"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "I"]
ignore = ["B008"]
